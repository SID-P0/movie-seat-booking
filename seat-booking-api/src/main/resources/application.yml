spring:
  application:
    name: seat-booking-api

  # Virtual Threads (Java 21)
  threads:
    virtual:
      enabled: true

  # PostgreSQL
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:seatbooking}
    username: ${DB_USER:app}
    password: ${DB_PASSWORD:apppassword}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
      minimum-idle: 5
      connection-timeout: 5000

  # JPA
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

  # Flyway
  flyway:
    enabled: false
    locations: classpath:db/migration
    baseline-on-migrate: true

  # Redis
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000
      lettuce:
        pool:
          max-active: 50
          max-idle: 20
          min-idle: 5

  # Kafka
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# Server
server:
  port: ${SERVER_PORT:8080}
  tomcat:
    max-threads: 200
    accept-count: 1000

# App-specific config
app:
  admin-token: ${ADMIN_TOKEN:super-secret-admin-token}
  hold-ttl-seconds: ${HOLD_TTL_SECONDS:15}
  sweeper:
    batch-size: 100

# Actuator / Metrics
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,info
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: seat-booking-api
